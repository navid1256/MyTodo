<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    # Railway terminates TLS at its edge. Trust this header only behind that proxy.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [R=301,L]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [END]
    </Directory>

    # Uploaded files must never execute as PHP or supply Apache configuration.
    <Directory /var/www/html/public/storage>
        AllowOverride None
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>

    <LocationMatch "(^|/)\.">
        Require all denied
    </LocationMatch>

    # This is a PHP/web-server liveness check, not a database readiness check.
    Alias /healthz /usr/local/share/mytodo/health.php
    <Directory /usr/local/share/mytodo>
        AllowOverride None
        Options None
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    <Location /build/assets/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
    <Files "service-worker.js">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
